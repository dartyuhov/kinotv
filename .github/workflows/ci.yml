# Tests on every push to a branch and on pull requests (spec §10). The release workflow also runs this
# one before it publishes, so a release always has a green run.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests, e2e and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the e2e tests
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npm run e2e

      - name: Build
        run: npm run build
        env:
          VITE_KP_CLIENT_ID: fixture-release-client-id
          VITE_KP_CLIENT_SECRET: fixture-release-client-secret

      - name: Assemble release assets from the production build
        run: npm run release:assets

      - name: Keep the e2e report when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
