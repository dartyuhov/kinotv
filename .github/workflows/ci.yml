# Tests on every push to a branch and on pull requests (spec §10). The release workflow also runs this
# one before it publishes, so a release always has a green run.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, tests, e2e and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Chromium for the e2e tests
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npm run e2e

      - name: Build
        run: npm run build

      - name: Keep the e2e report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
