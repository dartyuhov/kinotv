# Stages a validated draft when a maintainer pushes a version tag:
#
#   git tag v1.2.3 && git push origin v1.2.3        (the tag must equal "version" in package.json)
#
# Assets: KinoTV.wgt (unsigned), install.sh, kinotv-installer.mjs, SHA256SUMS.
# Re-run a failed tag run to repair an incomplete draft. Published releases are refused.
# Never publishes automatically: after validation, a maintainer reviews legal/launch
# acceptance and publishes manually. Do not publish while this workflow is running.
#
# Before the first release, set on GitHub (see README → "Publishing a release"):
#   - repository secrets KP_CLIENT_ID and KP_CLIENT_SECRET: configured borrowed app OAuth client;
#   - "kinotv": { "githubRepo" } in package.json: this repository, "<owner>/<repo>".
# Presence does not establish client ownership or upstream authorization.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      # Checks app client configuration presence only, and requires that the
      # tag matches package.json, and package.json names this repo. Logic and tests: tools/release/gate*.ts.
      - name: Check credentials, version and repo
        run: node tools/release/gate.ts
        env:
          KP_CLIENT_ID: ${{ secrets.KP_CLIENT_ID }}
          KP_CLIENT_SECRET: ${{ secrets.KP_CLIENT_SECRET }}

  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  draft:
    name: Build and validate draft
    needs: [gate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The maintainer-selected borrowed app client is intentionally embedded.
      # Per-user tokens/passwords are never build inputs. Secrets are scoped to this step.
      - name: Build the app
        run: npm run build
        env:
          VITE_KP_CLIENT_ID: ${{ secrets.KP_CLIENT_ID }}
          VITE_KP_CLIENT_SECRET: ${{ secrets.KP_CLIENT_SECRET }}

      - name: Make the release files
        run: npm run release:assets

      - name: Stage or repair and validate the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/draft.ts
